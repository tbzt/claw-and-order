<!--
  Tableau 2 — Sunnyside Beach Park, Tacoma, ~minuit.
  Nuit, eau, jetée. Aplats CSS pour le ciel, l'eau et les planches ;
  pixel art pour le voilier, le pêcheur, le lampadaire.
  Même grille que le tableau 1 : 256 x 144 (chantier 8).
-->
<div class="tableau tableau--quai">

  <div class="bande ciel"></div>
  <div class="etoiles"></div>
  <div class="rive"></div>
  <div class="bande eau" data-hotspot="eau"></div>
  <div class="reflets"></div>
  <!-- Les traînées de sodium des lampadaires, tordues par le clapot.
       Un aplat sombre ne se lit pas comme de l'eau ; un reflet qui
       se déforme, si. -->
  <div class="lueur lueur--a"></div>
  <div class="lueur lueur--b"></div>
  <div class="lueur lueur--c"></div>
  <div class="bande jetee" data-hotspot="jetee"></div>
  <div class="planches"></div>

  <div class="bateau-fond bf1"></div>
  <div class="bateau-fond bf2"></div>
  <div class="bateau-fond bf3"></div>

  <!-- Neuf cibles de détail vivaient ici — cabine, corps, trappe,
       moteur, les quatre postes, amarres — sur un sprite de 86 u, un
       tiers du cadre. Elles ont déménagé dans la vue rapprochée
       (chantier 25, scenes/quai-voilier.html) : une chose du monde,
       une seule cible. Le sprite reste, entier ; seul `voilier` y
       donne encore accès depuis ici. -->
  <div class="sprite--prop-voilier voilier" data-hotspot="voilier"></div>

  <div class="lampadaire"></div>
  <div class="halo-quai"></div>
  <div class="ombre ombre--pecheur"></div>
  <div class="sprite--prop-pecheur pecheur" data-hotspot="pecheur"></div>

  <div class="ombre ombre--drakk"></div>
  <div class="ombre ombre--rabbit"></div>
  <div class="ombre ombre--trash"></div>
  <div class="ombre ombre--hercules"></div>
  <div class="sprite--pj-drakk pj p-drakk" data-hotspot="drakk"></div>
  <div class="sprite--pj-white-rabbit pj p-rabbit" data-hotspot="rabbit"></div>
  <div class="sprite--pj-trash pj p-trash" data-hotspot="trash"></div>
  <div class="sprite--pj-hercules pj p-hercules" data-hotspot="hercules"></div>


  <!-- L’esprit mentor de Trash. Enveloppe + sprite : le trajet est
       sur l’une, les trois images sur l’autre. -->
  <div class="raton"><div class="sprite--raton"></div></div>
  <!-- ── Astral : ce que Trash lit, et personne d'autre ──────────────
       La piste de Toralf. Elle va du parking au bateau ET elle revient —
       c'est ça qui compte : il n'a pas couru. Donc il a décidé de partir,
       pas été chassé. Donc il pensait avoir fini, et il avait tort. -->
  <div class="calque calque--astral">
    <div class="trace trace--aller"></div>
    <div class="trace trace--retour"></div>
    <div class="empreinte e1"></div><div class="empreinte e2"></div>
    <div class="empreinte e3"></div><div class="empreinte e4"></div>
    <div class="tache" data-hotspot="trace"></div>
    <div class="ondine" data-hotspot="esprit-eau"></div>
    <div class="aura aura--pecheur"></div>
  </div>

  <!-- ── Tactique : le défilé, et le perchoir ─────────────────────
       La jetée est un goulet : une seule planche, aucun flanc. Et
       au-dessus du parking, l'endroit d'où un archer aurait tout vu.
       Toralf est sniper : Drakk trouve son poste sans savoir pourquoi. -->
  <div class="calque calque--tactique">
    <div class="grille-tac"></div>
    <div class="defile" data-hotspot="defile"></div>
    <div class="cote cote--defile">DÉFILÉ — AUCUN FLANC</div>
    <div class="perchoir" data-hotspot="perchoir"></div>
    <div class="cote cote--perchoir">PERCHOIR</div>
    <div class="menace menace--tir"></div>
    <div class="jeton j-pecheur"></div>
    <div class="issue issue--parking"></div>
    <div class="cote cote--parking">RETRAITE — 40 PAS</div>
  </div>

  <!-- ── RA : ce que White_Rabbit lit ────────────────────────────────
       Le port est saturé de balises que personne ne filtre. Deux ORA
       comptent dans le tas : le défaut d'allumage du voilier, qui pointe
       le compartiment moteur, et le commlink du pêcheur, éteint EXPRÈS.

       Elles étaient toutes les huit VIDES : l'ouverture du tableau
       promet « numéros de coque, publicités pour un ponton privé, trois
       offres de crédit », et le joueur voyait huit rectangles. Le
       principe est celui du bar — ce qui compte ne se distingue du spam
       que par sa TEINTE, et il faut lire pour trouver. -->
  <div class="calque calque--ra">
    <div class="ora ora--balise bl1">PONTON PRIVÉ · PLACES AU MOIS</div>
    <div class="ora ora--balise bl2">CRÉDIT IMMÉDIAT · 4 000 ¥ · SANS SIN</div>
    <div class="ora ora--balise bl3">RACHAT DE DETTE · 19,4 %</div>
    <div class="ora ora--balise bl4">PRÊT MARINE · PREMIER MOIS OFFERT</div>
    <div class="ora ora--immat" data-hotspot="immat">SV-2214 · WILSON, W. · « L’AMIRAL »</div>
    <div class="ora ora--defaut" data-hotspot="defaut">DÉFAUT D’ALLUMAGE</div>
    <div class="ora ora--muet" data-hotspot="commlink-eteint">HORS LIGNE</div>
    <div class="ora ora--epave" data-hotspot="commlink-noye">DERNIÈRE POSITION · −6 M</div>
  </div>

  <div class="pluie pluie--loin"></div>
  <div class="pluie pluie--pres"></div>
  <div class="nuit"></div>
</div>
