<!--
  Tableau 6 bis — LE TRIBUNAL, LE PARVIS. Chantier 20b pour la
  mécanique, CHANTIER 23 pour l'art.

  Décor au texte : le palais de justice de Downtown à neuf heures moins
  dix, deux Justice encapuchonnées penchées sur l'entrée et sans balance,
  les détecteurs dans l'axe, des gardes que l'accréditation satisfait, et
  McCarthy en civil qu'on n'avait pas revu depuis le bar.

  ORDRE DU DOM : le fond, puis le creux de l'entrée et ce qu'on y voit,
  puis ceux qui attendent, puis l'équipe qui arrive — et les jambages du
  portique en dernier, parce qu'ils sont devant tout. Grille 256 x 144.
-->
<div class="tableau tableau--tribunal">

  <div class="ciel"></div>
  <div class="facade"></div>
  <div class="parvis"></div>
  <div class="fenetre-etage" data-hotspot="fenetre"></div>
  <div class="corniche"></div>

  <!-- Les deux Justice encapuchonnées, de part et d'autre de l'entrée.
       Même carte, la seconde retournée : elles se font face. -->
  <div class="colonne colonne--g"></div>
  <div class="statue statue--g sprite--prop-justice" data-hotspot="sculptures"></div>
  <div class="colonne colonne--d"></div>
  <div class="statue statue--d sprite--prop-justice" data-hotspot="sculptures"></div>

  <!-- L'entrée : le creux, les couloirs qu'on aperçoit, les deux
       battants entrebâillés, et le portique de détection devant eux. -->
  <div class="portail"></div>
  <div class="galeries sprite--prop-galerie" data-hotspot="galeries"></div>
  <div class="porte-salle porte-salle--g" data-hotspot="entree"></div>
  <div class="porte-salle porte-salle--d" data-hotspot="entree"></div>
  <div class="detecteur detecteur--g" data-hotspot="detecteurs"></div>
  <div class="detecteur detecteur--d" data-hotspot="detecteurs"></div>
  <div class="detecteur detecteur--haut" data-hotspot="detecteurs"></div>

  <!-- Ceux qui sont déjà là. Les trois gardes portent la MÊME carte :
       « un garde parmi d'autres », dit le texte, et c'est Hercules qui
       doit le distinguer, pas sa couleur. -->
  <div class="ombre ombre--mccarthy"></div>
  <div class="ombre ombre--garde-a"></div>
  <div class="ombre ombre--garde-t"></div>
  <div class="ombre ombre--garde-b"></div>
  <div class="pnj p-mccarthy sprite--mccarthy" data-hotspot="mccarthy"></div>
  <div class="pnj garde garde--a sprite--prop-garde" data-hotspot="gardes"></div>
  <div class="pnj garde garde--trouble sprite--prop-garde" data-hotspot="garde-trouble"></div>
  <div class="pnj garde garde--b sprite--prop-garde" data-hotspot="gardes"></div>

  <!-- L'équipe, en chemin vers la salle. -->
  <div class="ombre ombre--drakk"></div>
  <div class="ombre ombre--trash"></div>
  <div class="ombre ombre--rabbit"></div>
  <div class="ombre ombre--hercules"></div>
  <div class="sprite--pj-drakk pj p-drakk" data-hotspot="drakk"></div>
  <div class="sprite--pj-white-rabbit pj p-rabbit" data-hotspot="rabbit"></div>
  <div class="sprite--pj-trash pj p-trash" data-hotspot="trash"></div>
  <div class="sprite--pj-hercules pj p-hercules" data-hotspot="hercules"></div>

  <div class="jambage jambage--g"></div>
  <div class="jambage jambage--d"></div>


  <!-- ── Ce que Trash voit, et lui seul ────────────────────────────
       « Le plan astral d'un tribunal ne devrait pas avoir peur. Celui-ci,
       si. » Deux choses, et la seconde explique la première : un courant
       froid qui DESCEND du couloir du fond, et une couche de peur
       accumulée à hauteur d'homme sur la ligne du portique — l'endroit
       exact où, depuis des années, tout le monde vide ses poches.

       LES TROIS GARDES ONT LA MÊME AURA, AU PIXEL PRÈS, et c'est la
       règle du tableau : « un garde parmi d'autres ». Le décor refuse
       déjà de désigner le troisième par une couleur ; une lentille qui
       le ferait à sa place vendrait la mèche encore plus tôt. -->
  <div class="calque calque--astral">
    <div class="courant"></div>
    <div class="peur-basse"></div>
    <div class="aura aura--mccarthy"></div>
    <div class="aura aura--garde ag-a"></div>
    <div class="aura aura--garde ag-t"></div>
    <div class="aura aura--garde ag-b"></div>
  </div>

  <!-- ── Ce que Drakk voit, et lui seul ───────────────────────────
       « Une seule sortie civilisée. C'est une donnée, pas une
       accusation. » Un parvis est une esplanade : rien pour s'abriter
       sauf deux colonnes, et une fenêtre entrouverte au deuxième qui
       tient tout le monde en enfilade.

       AUCUN MARQUEUR NE PORTE DE CIBLE ICI. L'entrée, la fenêtre et les
       gardes en sont déjà, dans le décor — une chose du monde n'a droit
       qu'à un seul hotspot, et la lentille de Drakk les DÉSIGNE au lieu
       de les redoubler. -->
  <div class="calque calque--tactique">
    <div class="grille-tac"></div>
    <div class="issue issue--entree"></div>
    <div class="cote cote--entree">SEULE ISSUE CIVILISÉE</div>
    <div class="menace menace--fenetre"></div>
    <div class="cote cote--fenetre">ANGLE PLONGEANT · 2ᵉ ÉT.</div>
    <div class="couvert couvert--colonne cc-g"></div>
    <div class="couvert couvert--colonne cc-d"></div>
    <div class="cote cote--couvert">SEUL COUVERT</div>
    <div class="cote cote--decouvert">PARVIS — À DÉCOUVERT</div>
    <div class="jeton jeton--hostile jg-a"></div>
    <div class="jeton jeton--hostile jg-t"></div>
    <div class="jeton jeton--hostile jg-b"></div>
    <div class="jeton j-mccarthy"></div>
  </div>

  <!-- ── Ce que White_Rabbit voit, et lui seul ────────────────────
       CONTRE-EXEMPLE ASSUMÉ DE LA RÈGLE 7. La RA est bruyante partout —
       sauf ici : « la RA du palais est presque vide », dit sa propre
       vue, et c'est ce vide qui rend la seule chose de trop visible. Un
       palais de justice ne loue pas d'espace publicitaire ; quatre
       balises de service, et rien d'autre à quoi se raccrocher.

       LA CAMÉRA ARAIGNÉE NE CLIGNOTE PAS. Tout ce qui bat, dans les
       autres lentilles RA du jeu, dit « ceci est vivant » ; celle-ci
       est immobile parce que le texte l'est : « Elle ne bouge pas. Elle
       regarde quand même. » Elle est aussi tapie SOUS la fenêtre du
       deuxième — celle que Drakk trouve trop commodément entrouverte.
       Deux lentilles, deux lectures, le même mètre carré. -->
  <div class="calque calque--ra">
    <div class="ora ora--palais">PALAIS DE JUSTICE · DOWNTOWN · ACCÈS PUBLIC</div>
    <div class="ora ora--audiences">AUDIENCES 09:00 — SALLE 2 · SALLE 4 · SALLE 7</div>
    <div class="ora ora--orientation">→ SALLES 1-6 · GREFFE · DÉPÔT</div>
    <div class="ora ora--portique">PORTIQUE 2 · MASSE FERREUSE · ACTIF</div>
    <div class="araignee"></div>
    <div class="ora ora--araignee">SANS IMMAT. · FLUX SORTANT</div>
  </div>

</div>
