<!--
  Tableau 6 — LE TRIBUNAL, LA SALLE D'AUDIENCE. Chantier 20 pour la
  mécanique (`depose()` et la barre), CHANTIER 23 pour l'art.

  Décor au texte : un banc surélevé et le juge qui écoute, le box où
  Lester attend en combinaison orange, deux tables de part et d'autre de
  l'allée, la barre des témoins seule au milieu — et, de dos au premier
  plan, une galerie qui n'est venue pour personne.

  ORDRE DU DOM, ET IL DIT LA PROFONDEUR : chaque personne PRÉCÈDE le
  meuble qui la coupe (le juge son banc, Lester son box, les avocats
  leur table), et la galerie passe en dernier parce qu'elle est devant
  tout le monde. Grille 256 x 144 (chantier 8).
-->
<div class="tableau tableau--tribunal-salle">

  <div class="mur"></div>
  <div class="lambris"></div>
  <div class="sol"></div>

  <!-- Les deux rampes de plafond : la source de lumière du tableau,
       celle qui a décidé du liseré des figures dans l'atelier. -->
  <div class="plafonnier plafonnier--a"></div>
  <div class="plafonnier plafonnier--b"></div>

  <!-- Le juge, puis son banc, qui le coupe. La cible est sur LUI. -->
  <div class="pnj juge sprite--prop-juge" data-hotspot="juge"></div>
  <div class="banc-juge"></div>
  <div class="estrade"></div>

  <!-- Le retour vers le parvis — gratuit, comme quai-voilier → quai. -->
  <div class="porte-laterale" data-hotspot="reculer"></div>

  <!-- La barre des témoins, seule dans l'allée — c'est elle qui compte
       ce soir. `depose()` ne s'y déclenche pas par un clic ici : voir
       le bouton dédié dans le carnet. -->
  <div class="barre-temoins" data-hotspot="barre"></div>

  <!-- Lester, puis le box qui le coupe à la poitrine. En combinaison de
       détention : la seule scène du jeu où la carte de base n'est pas
       `sprite--lester` (voir CARTES_PORTEES, main.js). -->
  <div class="sprite--lester-detenu p-lester" data-hotspot="lester"></div>
  <div class="box-lester"></div>

  <!-- Les deux avocats, chacun derrière sa table. Le texte les nomme
       depuis le chantier 20 ; jusqu'ici on cliquait le meuble. -->
  <div class="pnj avocate sprite--prop-avocate" data-hotspot="defense"></div>
  <div class="table table--defense"></div>
  <div class="pnj procureur sprite--prop-procureur" data-hotspot="accusation"></div>
  <div class="table table--accusation"></div>

  <!-- L'équipe, debout du côté de la défense — pas assise, elle n'est
       pas partie au procès. -->
  <div class="ombre ombre--drakk"></div>
  <div class="ombre ombre--trash"></div>
  <div class="ombre ombre--rabbit"></div>
  <div class="ombre ombre--hercules"></div>
  <div class="sprite--pj-drakk pj p-drakk" data-hotspot="drakk"></div>
  <div class="sprite--pj-white-rabbit pj p-rabbit" data-hotspot="rabbit"></div>
  <div class="sprite--pj-trash pj p-trash" data-hotspot="trash"></div>
  <div class="sprite--pj-hercules pj p-hercules" data-hotspot="hercules"></div>

  <!-- La galerie, de dos, au premier plan : deux blocs et l'allée entre
       eux. La même carte, retournée pour le second. -->
  <div class="galerie galerie--g sprite--prop-galerie" data-hotspot="galerie"></div>
  <div class="galerie galerie--d sprite--prop-galerie" data-hotspot="galerie"></div>

  <!-- La sortie, au bout de l'allée. -->
  <div class="porte-tribunal" data-hotspot="sortir"></div>


  <!-- ── Ce que Trash voit, et lui seul ────────────────────────────
       QUATRE AURAS QUI NE SE RESSEMBLENT PAS, et chacune répète ce que
       son hotspot dit déjà en toutes lettres : le juge ÉCOUTE (une aura
       lente, sans à-coup, la seule de la salle qui ne tremble pas),
       l'avocate SE BAT AVEC CE QU'ON LUI DONNE (serrée, vive), le
       procureur VEUT QUE CE SOIT FINI (grise, molle, presque éteinte),
       Lester regarde ses mains.

       ET LA GALERIE N'EST PAS UN HALO. « Personne, ici, n'est venu pour
       Lester » : une indifférence n'a pas de porteur, donc pas de
       forme ronde. C'est une nappe plate, uniforme, sans battement —
       on ne dessine pas une absence en n'y mettant rien. -->
  <div class="calque calque--astral">
    <div class="barre-froid"></div>
    <div class="aura aura--juge"></div>
    <div class="aura aura--lester"></div>
    <div class="aura aura--defense"></div>
    <div class="aura aura--accusation"></div>
    <div class="indifference"></div>
  </div>

  <!-- ── Ce que Drakk voit, et lui seul ───────────────────────────
       Le pendant exact du parvis, et c'est pour ça que les deux
       tableaux ont été faits ensemble : dehors, « une seule sortie
       civilisée » ; ici, deux issues, des tables pour se mettre à
       couvert, une estrade en position haute — tout ce qu'il faut pour
       tenir une pièce, et rien à y tenir. Le vocabulaire est faux, la
       lecture est juste : il n'y a pas de bataille ici, il y a un
       homme au banc. -->
  <div class="calque calque--tactique">
    <div class="grille-tac"></div>
    <div class="issue issue--allee"></div>
    <div class="cote cote--allee">ISSUE — L’ALLÉE</div>
    <!-- R4 : l'issue de l'allée est déjà `sortir` dans le décor ; la
         latérale, non — c'est la porte par laquelle on emmène Lester
         quand c'est fini, et personne d'autre ne la regarde. -->
    <div class="issue issue--laterale" data-hotspot="issue-laterale"></div>
    <div class="cote cote--laterale">ISSUE LATÉRALE</div>
    <div class="couvert couvert--banc"></div>
    <div class="cote cote--hauteur">POSITION HAUTE</div>
    <div class="couvert couvert--table ct-g"></div>
    <div class="couvert couvert--table ct-d"></div>
    <div class="cote cote--couvert">COUVERT — TABLES</div>
    <div class="cote cote--rien">RIEN À TENIR ICI</div>
    <div class="jeton j-juge"></div>
    <div class="jeton j-lester"></div>
  </div>

  <!-- ── Ce que White_Rabbit voit, et lui seul ────────────────────
       Même exception à la règle 7 que le parvis : un palais de justice
       ne loue pas de mètre carré de réclame. Cinq fiches de service, et
       DEUX D'ENTRE ELLES SONT DES CHIFFRES QUE LA PROSE DONNAIT DÉJÀ —
       « trois pages, et il en a déjà tourné deux » se lit à l'écran,
       et « le manque de conviction est mesurable » cesse d'être une
       formule.

       LE MICRO DE LA BARRE EST EN ATTENTE, parce que le texte le dit :
       « un micro qu'on n'a pas encore allumé ». Et LA FICHE DU RÔLE SUIT
       LE MARTEAU : dès que le joueur a répondu à McCarthy, elle passe à
       « AUDIENCE REPOUSSÉE » — mais pas trois jours plus tard, quand
       l'audience a bel et bien lieu. Le détail est au bas de
       `css/scene-tribunal-salle.css`. -->
  <div class="calque calque--ra">
    <div class="ora ora--role">RÔLE DU JOUR · SALLE 4 · AUDIENCE EN COURS</div>
    <!-- R4 : la première cible de calque de ce tableau. Elle est libre
         parce que rien, dans le décor, n'est le greffe — la
         transcription n'existe qu'en RA. Les quatre autres fiches
         désignent des choses qui ont déjà leur cible (le micro est la
         barre, le dossier est l'accusation) : une chose du monde, une
         seule cible. -->
    <div class="ora ora--greffe" data-hotspot="transcription">TRANSCRIPTION · EN DIRECT · NON SIGNÉE</div>
    <div class="ora ora--banc">TERMINAL DU BANC · SAISIE EN COURS</div>
    <div class="ora ora--micro">BARRE · MICRO EN ATTENTE</div>
    <div class="ora ora--dossier">ACCUSATION · 3 P. · 2 TOURNÉES</div>
  </div>

</div>
