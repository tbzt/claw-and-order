<!--
  Tableau 5 bis — STRAUBER ANTIQUITÉS, l'arrière-boutique de Herwick.
  Chantier 36 (`PLAN_PLANQUES.md` § 3.2), étape B du § 8 — « la planque
  de Drakk, en pilote ».

  PASSE D'ART FAITE (chantier 23, lot des cinq planques). Herwick a son
  sprite depuis le lot 7 ; la PILE DE MEUBLES et la COMTOISE ARRÊTÉE
  sont neuves. « Empilés jusqu'au plafond » se dessine par une seule
  chose — la pile sort du cadre par le haut — et deux cadres VIDES sont
  glissés dedans.

  ORDRE DU DOM = ORDRE DE PILE (pas de `z-index` posé ici) : l'équipe et
  Lester sont placés EN PREMIER, tout le mobilier cliquable APRÈS, pour
  que les cibles mécaniquement importantes (rideau, armoire, caisse,
  comptoir, porte) gagnent toujours la main sur un sprite qui les
  recouvrirait — trouvé en vérifiant les hit-tests, pas en relisant.

  Grille 256 x 144 (chantier 8), même convention que les autres tableaux.
-->
<div class="tableau tableau--herwick">

  <div class="fond"></div>
  <div class="plinthe"></div>
  <div class="sol"></div>
  <div class="ampoule"></div>

  <div class="comptoir" data-hotspot="comptoir"></div>
  <div class="caisse" data-hotspot="caisse"></div>
  <div class="ombre ombre--drakk"></div>
  <div class="ombre ombre--trash"></div>
  <div class="ombre ombre--rabbit"></div>
  <div class="ombre ombre--hercules"></div>
  <div class="ombre ombre--herwick"></div>
  <div class="sprite--pj-drakk pj p-drakk" data-hotspot="drakk"></div>
  <div class="sprite--pj-white-rabbit pj p-rabbit" data-hotspot="rabbit"></div>
  <div class="sprite--pj-trash pj p-trash" data-hotspot="trash"></div>
  <div class="sprite--pj-hercules pj p-hercules" data-hotspot="hercules"></div>

  <!-- LESTER, dans le fauteuil qui vaut plus cher que tout ce qu'il a
       jamais possédé. -->
  <div class="fauteuil"></div>
  <div class="ombre ombre--lester"></div>
  <div class="sprite--lester p-lester" data-hotspot="lester"></div>

  <!-- Le stock : quarante ans de meubles empilés, en arrière-plan. -->
  <div class="meubles meubles--b sprite--prop-meubles"></div>

  <!-- Le rideau de fer, à l'arrière-plan : la seule ouverture sur la
       rue, et la ligne de tir de 8 h 40.
       Classe `volet-fer`, pas `rideau` : `.rideau` est déjà pris par le
       rideau de FIN (`engine.css`, z-index 70, plein écran) — une
       collision de nom trouvée en vérifiant, pas en relisant le code. -->
  <div class="volet-fer" data-hotspot="rideau"></div>

  <!-- La vitrine latérale, dans l'angle mort du rideau — la cible de
       la précaution d'Hercules, distincte du rideau (une chose du
       monde, une seule cible). -->
  <div class="vitrine-laterale"></div>
  <div class="armoire" data-hotspot="armoire"></div>

  <div class="meubles meubles--a sprite--prop-meubles" data-hotspot="meubles"></div>

  <div class="horloge-arretee sprite--prop-comtoise" data-hotspot="horloge"></div>

  <!-- Herwick — deux postures, la debout et la blessée, départagées par
       `data-etat`. Sprites depuis le chantier 23. -->
  <div class="herwick herwick--debout sprite--prop-herwick" data-hotspot="herwick"></div>
  <div class="herwick herwick--assis sprite--prop-herwick-assis" data-hotspot="herwick"></div>
  <div class="tache-sang"></div>

  <!-- La sortie, au premier plan : la porte de service vers la ruelle. -->
  <div class="porte-service" data-hotspot="porte"></div>


  <!-- ── Ce que Trash voit, et lui seul ────────────────────────────
       LE SEUL CALQUE ASTRAL DU JEU QUI NE CONTIENT AUCUNE AURA, et
       c'est sa vue qui l'exige, mot pour mot : « C'est saturé. Je ne
       trouve pas son aura à lui là-dedans. JE NE TROUVE PERSONNE —
       c'est la première fois de la nuit que je vois MOINS que ce qu'il
       y a. » Poser un halo sur Herwick ou sur Lester aurait démenti la
       seule phrase que Trash prononce ici.

       Ce qu'il y a à la place : quarante ans de deuils déposés sur des
       meubles, en trop grand nombre pour qu'aucun se détache. La
       saturation est faite de trois trames qui ne s'alignent pas — un
       dégradé propre aurait dit « brouillard », il fallait « foule ».

       C'EST L'INVERSE EXACT DU CABINET DE SARAH, et les deux tableaux
       ont été faits le même jour pour ça : là-bas, « pas de meuble pour
       cacher une aura », et Trash voit tout ; ici, rien que des meubles,
       et il ne voit rien. Deux planques, une seule loi. -->
  <div class="calque calque--astral">
    <div class="saturation"></div>
    <div class="deuils"></div>
  </div>

  <!-- ── Ce que Drakk voit, et lui seul ───────────────────────────
       Le rideau de fer est la seule ouverture sur la rue, donc la ligne
       de tir de 8 h 40 — et c'est la seule menace du jeu QUE LE JOUEUR
       PEUT EFFACER : baisser le rideau la retire de la carte. Sans ça,
       la lentille annonçait un danger et ne disait jamais qu'on venait
       de le résoudre. -->
  <div class="calque calque--tactique">
    <div class="grille-tac"></div>
    <div class="menace menace--rideau"></div>
    <div class="cote cote--rideau">LIGNE DE TIR — RUE</div>
    <div class="issue issue--porte"></div>
    <div class="cote cote--porte">SEULE ISSUE</div>
    <div class="couvert couvert--comptoir"></div>
    <div class="cote cote--couvert">COUVERT — COMPTOIR</div>
    <div class="jeton j-herwick"></div>
    <div class="jeton j-lester"></div>
  </div>

  <!-- ── Ce que White_Rabbit voit, et lui seul ────────────────────
       « Une seule icône, au-dessus de la caisse. » Une, et le chiffre
       est dans la prose du hotspot : « le petit voyant vert qui
       clignotait TOUTES LES QUARANTE SECONDES ». Il est écrit sur la
       fiche, et la fiche s'éteint quand le joueur coupe la caisse —
       même geste que la caméra aveuglée de la laverie. -->
  <div class="calque calque--ra">
    <div class="ora ora--caisse">TERMINAL CAISSE · ÉMISSION 40 S</div>
  </div>

</div>
