<!--
  Tableau 5 quinquies — LE SQUAT DE TRASH. Chantier 40 (`PLAN_PLANQUES.md`
  § 3.4), étape C du § 8 — après Herwick (36), Sarah (37, 1/2, rétrogradée
  au 39) et Duke (37, 2/2).

  PASSE D'ART FAITE (chantier 23, lot des cinq planques) : l'AUTEL et le
  MIROIR sont neufs, et le sol en est un. Trash garde son sprite

  conversation, jamais une seconde ouverture sur l'extérieur.

  ORDRE DU DOM = ORDRE DE PILE (pas de `z-index` posé ici) : l'équipe et
  Lester en premier, le mobilier cliquable après.

  Grille 256 x 144 (chantier 8), même convention que les autres tableaux.
-->

  <!-- ── Ce que Trash voit, et lui seul ────────────────────────────
       C'EST SA LOGE, ET UNE LOGE A UN BORD. « La loge est PRÉPARÉE —
       accordée à celui qui l'a montée » : ça ne se dessine pas en
       posant un halo de plus, ça se dessine en fermant la pièce. Le
       cercle a une lisière nette, centrée sur le métier à tisser, et
       son aura à lui n'est pas posée dedans — elle en fait partie, «
       comme un vêtement porté longtemps ».

       LESTER EST LE SEUL À AVOIR UN CONTOUR À LUI, et il est froid :
       c'est la seule aura de la pièce qui n'appartienne pas à
       l'endroit. Un invité dans la maison de quelqu'un d'autre.

       Le raton laveur n'est pas ici : il est natif de l'astral et
       `engine.css` s'en occupe depuis le chantier 16. -->
  <div class="calque calque--astral">
    <div class="loge"></div>
    <div class="autel-chaud"></div>
    <div class="aura aura--trash"></div>
    <div class="aura aura--lester"></div>
  </div>

  <!-- ── Ce que Drakk voit, et lui seul ───────────────────────────

       contrebas par lequel on peut monter. Tenir le palier retire la
       menace de la carte : même geste qu'au rideau de Herwick, et la
       lentille cesse d'annoncer un danger que le joueur vient de
       régler. -->
  <div class="calque calque--tactique">
    <div class="grille-tac"></div>
    <div class="issue issue--trappe"></div>
    <div class="cote cote--trappe">SEUL ACCÈS — TOIT</div>

    <div class="couvert couvert--fauteuil"></div>
    <div class="cote cote--couvert">COUVERT</div>
    <div class="jeton j-lester"></div>
  </div>

  <!-- ── Ce que White_Rabbit voit, et lui seul ────────────────────
       « Une seule icône, mal cachée : un branchement volé… QUI ALIMENTE

       fils comptables — parce que « trois » est écrit dans le texte, et

       « Il n'y a pas d'adresse à trouver sur un réseau. ÇA, en

  <div class="calque calque--ra">
    <div class="ora ora--branchement">BRANCHEMENT · NON DÉCLARÉ</div>
    <div class="bus-vole"></div>
    <div class="fil-lampe fl1"></div>
    <div class="fil-lampe fl2"></div>
    <div class="fil-lampe fl3"></div>
