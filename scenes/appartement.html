<!--
  Tableau 9 — L'APPARTEMENT DE TERESA BANKS. Chantier 26
  (`PLAN_TRAME_ACTES_III_IV.md` § 7.1-7.2, rang 6 du § 10) — la première
  des trois ancres du scénario source, et le second tableau de l'acte IV.

  PASSE D'ART FAITE (chantier 23, 3ᵉ décor). Sept sprites, et tout ce
  studio dit la même chose de six façons — ILS ÉTAIENT DEUX : deux
  brosses à dents dans le placard, deux verres et deux assiettes dans
  l'évier, la poudre à empreintes en aplats réguliers sur la tête de
  lit, la valise dont il manque le dessus, la facture Lockworks dans le
  tas de courrier, et le lecteur du hall posé de travers.

  ET LE SOL EN EST UN, MAINTENANT : trois bandes au lieu de deux, et des
  lignes de pieds vraies. Avant ce lot, l'équipe s'arrêtait cinquante
  unités au-dessus de la ligne de sol.

  LA PIÈCE RESTE VIDE — trois jours, et c'est exactement ce qu'elle a à
  dire — MAIS L'IMMEUBLE NE L'EST PAS (chantier 54, nœud 3, la scène
  pilote) : la patronne du pressing, en bas de la cage d'escalier, une
  voix sans sprite comme McCarthy au téléphone ou la vedette sur le 16.
  Les quatre runners sont les seuls à porter un corps dans ce décor.

  LA PORTE EST À LA FOIS LA CIBLE DES SCELLÉS ET LA SORTIE — une chose du
  monde, une seule cible. Le LECTEUR DU HALL, lui, en est une autre : il
  est en bas de l'escalier, visible par la porte restée ouverte, et c'est
  la serrure de l'IMMEUBLE, pas celle du studio.

  ORDRE DU DOM = ORDRE DE PILE (pas de `z-index` posé ici) : l'équipe
  d'abord, le mobilier ensuite.

  Grille 256 x 144 (chantier 8), même convention que les autres tableaux.
-->
<div class="tableau tableau--appartement">

  <div class="fond"></div>
  <div class="plinthe"></div>
  <div class="sol"></div>

  <!-- Le jour qui entre par la fenêtre — premier tableau diurne du jeu
       avec le local de répétition. -->
  <div class="jour"></div>

  <div class="ombre ombre--drakk"></div>
  <div class="ombre ombre--trash"></div>
  <div class="ombre ombre--rabbit"></div>
  <div class="ombre ombre--hercules"></div>
  <div class="sprite--pj-drakk pj p-drakk" data-hotspot="drakk"></div>
  <div class="sprite--pj-trash pj p-trash" data-hotspot="trash"></div>
  <div class="sprite--pj-white-rabbit pj p-rabbit" data-hotspot="rabbit"></div>
  <div class="sprite--pj-hercules pj p-hercules" data-hotspot="hercules"></div>

  <!-- La cage d'escalier, par la porte restée ouverte, et le lecteur de
       la porte de l'immeuble tout en bas. -->
  <div class="cage-escalier"></div>
  <div class="lecteur-hall sprite--prop-lecteur" data-hotspot="maglock"></div>

  <!-- La patronne du pressing, en bas de la cage — aucune figure : la
       lumière chaude qui remonte l'escalier suffit à la situer. -->
  <div class="pressing" data-hotspot="pressing"></div>

  <!-- La porte du studio et ses deux rubans de RA : la sortie. -->
  <div class="porte-scellee" data-hotspot="porte">
    <span class="ruban ruban--haut"></span>
    <span class="ruban ruban--bas"></span>
  </div>

  <div class="fenetre-rue sprite--prop-fenetre" data-hotspot="fenetre"></div>

  <div class="placard-pharmacie sprite--prop-pharmacie" data-hotspot="pharmacie"></div>

  <div class="coin-cuisine sprite--prop-cuisine" data-hotspot="cuisine"></div>

  <!-- La pile de courrier, poussée contre le mur près de la porte. -->
  <div class="pile-courrier sprite--prop-courrier" data-hotspot="courrier"></div>

  <!-- Le lit nu, la poudre à empreintes, et la valise dessous. -->
  <div class="lit-nu sprite--prop-lit" data-hotspot="lit"></div>
  <div class="valise-cabine sprite--prop-valise" data-hotspot="valise"></div>


  <!-- ── Ce que Trash voit, et lui seul ────────────────────────────
       UN SEUL ÉLÉMENT DANS TOUT LE CALQUE, et c'est le calque astral le
       plus vide du jeu. Sa vue ne laisse aucune marge : « Il reste de la
       peur, EN COUCHE MINCE, À HAUTEUR D'HOMME, et elle est vieille de
       trois jours. RIEN D'AUTRE. » Pas de halo sur le lit, pas de nœud
       à l'endroit où elle est morte — trois mots l'interdisent, et
       ajouter le halo que le joueur attend aurait démenti la seule
       chose que Trash dit ensuite : « Je ne peux pas le prouver. »

       ET ELLE NE BAT PAS. Toutes les auras du jeu respirent ; celle-ci
       a trois jours et ne respire plus. C'est la seule chose qui la
       distingue d'une aura vivante, et c'est suffisant.

       La bande s'arrête au chambranle : la peur est dans la PIÈCE. La
       cage d'escalier, elle, appartient à la lentille de Rabbit. -->
  <div class="calque calque--astral">
    <!-- R4 : libre, et c'est le seul élément astral du jeu qui ne double
         aucune cible du décor — la pièce elle-même n'en est pas une. -->
    <div class="peur-mince" data-hotspot="peur"></div>
  </div>

  <!-- ── Ce que Drakk voit, et lui seul ───────────────────────────
       « On ne choisit pas cet endroit pour tuer quelqu'un. On y tue
       quelqu'un parce qu'on y était déjà. » Ce que la carte montre est
       ce qui produit cette phrase : une porte, une fenêtre qui expose,
       une masse derrière laquelle se mettre, et AUCUN JETON — premier
       tableau du jeu sans personne dedans, donc première carte tactique
       sans un seul marqueur. La grille toute seule dit déjà tout. -->
  <div class="calque calque--tactique">
    <div class="grille-tac"></div>
    <div class="issue issue--porte"></div>
    <div class="cote cote--porte">SEULE ISSUE</div>
    <div class="menace menace--fenetre"></div>
    <div class="cote cote--fenetre">EXPOSÉ — RUE</div>
    <div class="couvert couvert--lit"></div>
    <div class="cote cote--couvert">COUVERT — LE LIT</div>
    <!-- R4 : les trois autres marqueurs tactiques doublent `porte`,
         `fenetre` et `lit`. Celui-ci ne double rien — ce n'est pas une
         chose de la pièce, c'est la conclusion qu'on en tire. -->
    <div class="cote cote--approche" data-hotspot="approche">AUCUNE VOIE D’APPROCHE</div>
  </div>

  <!-- ── Ce que White_Rabbit voit, et lui seul ────────────────────
       LA BLAGUE DU TABLEAU EST DANS LA RÉPARTITION, pas dans le nombre.
       « Cette pièce est morte côté réseau, et la cage d'escalier ne
       l'est pas du tout. C'est DEHORS qu'il faut regarder. » Donc :
       trois fiches dedans, quatre dehors — et la seule réclame du
       tableau est sur le palier, à un mètre d'une scène de crime que
       personne n'est venu rouvrir depuis trois jours.

       LES DEUX RUBANS DE SCELLÉS NE SONT PAS ICI, et c'est voulu : ils
       sont déjà dans le décor, en RA, teinte froide et changement
       d'état compris (voir plus haut dans cette feuille). Les redoubler
       en fiche aurait fait deux fois la même chose. Ce que la lentille
       AJOUTE, c'est leur journal — et un journal à zéro rupture est un
       fait que le décor ne pouvait pas montrer. -->
  <div class="calque calque--ra">
    <div class="ora ora--scelle">SCELLÉ LS · RUPTURES : 0</div>
    <div class="ora ora--lecteur">LOCKWORKS · JOURNAL</div>
    <div class="ora ora--courrier">3 J · NON ACCUSÉS RÉCEPTION</div>
    <!-- R4 : le scellé, le lecteur et le courrier ont déjà leur cible
         dans le décor. Le palier, non — et c'est là que se trouve la
         seule fiche du tableau qui parle de quelqu'un de vivant. -->
    <div class="ora ora--palier op1" data-hotspot="voisin">4B · PRÉSENT</div>
    <div class="ora ora--palier op2">LIVRAISON · 4 MIN</div>
    <div class="ora ora--palier op3">IMMEUBLE · NŒUD PUBLIC</div>
    <div class="ora ora--palier op4">SOYCAF PRO · -20 %</div>
  </div>

</div>
