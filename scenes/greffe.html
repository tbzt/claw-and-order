<!--
  Tableau 3 — McNeil, le greffe. ~4 h du matin.
  Le scénario : « Là-bas, ils devront présenter le mandat de transfert
  pour extraire la cible. » Le conflit est dans le registre : le transfert
  y est inscrit à 08:00, par la navette. Celle où Lester doit mourir.
  Élévation frontale, grille 256 x 144 (chantier 8).
-->
<div class="tableau tableau--greffe">

  <div class="bande mur"></div>
  <div class="bande plinthe"></div>
  <div class="bande sol"></div>

  <div class="neon neon--a"></div>
  <div class="neon neon--b"></div>
  <div class="halo halo--a"></div>
  <div class="halo halo--b"></div>

  <!-- L'heure d'arrivée dépend de la route prise au voilier (§ D13) et
       `greffe.js` la dit à la minute : 3 h 46 avec l'esprit de l'eau,
       4 h 12 sans. Un cadran pouvait rester vague ; un afficheur ne le
       peut pas — il donne un chiffre, donc il ment la moitié du temps
       s'il n'y en a qu'un. Deux panneaux, un par route, et le CSS n'en
       montre qu'un : `esprit-eau` est déjà un `visuels`, posé par
       `quai-voilier.js`. -->
  <div class="sprite--prop-heure-0412 horloge horloge--sans" data-hotspot="horloge"></div>
  <div class="sprite--prop-heure-0346 horloge horloge--avec" data-hotspot="horloge"></div>
  <div class="affiche af1"></div><div class="affiche af2"></div>

  <div class="ombre ombre--gardien"></div>
  <div class="sprite--prop-gardien gardien" data-hotspot="gardien"></div>
  <div class="guichet sprite--prop-guichet"></div>
  <div class="hygiaphone sprite--prop-hygiaphone" data-hotspot="hygiaphone"></div>
  <div class="ombre ombre--registre"></div>
  <div class="registre sprite--prop-registre" data-hotspot="registre"></div>

  <div class="sas" data-hotspot="sas"></div>
  <div class="sas-vitre"></div>
  <!-- Le banc, en deux pièces qui portent la même cible : le tronçon
       du couloir (que l'équipe recouvre entièrement, et c'est juste —
       ils sont debout devant) et celui du renfoncement de gauche, que
       personne n'occupe. Sans le second, la cible était morte : 0/64.
       Il gagne au passage les pieds qu'il n'a jamais eus — une planche
       de 46 x 6 flottant à un mètre du sol n'est pas un banc. -->
  <div class="banc banc--couloir sprite--prop-banc" data-hotspot="banc"></div>
  <div class="banc-pied banc-pied--a sprite--prop-banc-pied"></div>
  <div class="banc-pied banc-pied--b sprite--prop-banc-pied"></div>
  <div class="banc banc--coin sprite--prop-banc" data-hotspot="banc"></div>
  <div class="banc-pied banc-pied--c sprite--prop-banc-pied"></div>

  <!-- Lester, révélé seulement une fois `lester-arrive` — la scène le
       fait ENTRER, elle ne le narre plus depuis les coulisses. -->
  <div class="ombre ombre--lester"></div>
  <div class="sprite--lester p-lester" data-hotspot="lester"></div>

  <div class="ombre ombre--drakk"></div><div class="ombre ombre--rabbit"></div>
  <div class="ombre ombre--trash"></div><div class="ombre ombre--hercules"></div>
  <div class="sprite--pj-drakk pj p-drakk" data-hotspot="drakk"></div>
  <div class="sprite--pj-white-rabbit pj p-rabbit" data-hotspot="rabbit"></div>
  <div class="sprite--pj-trash pj p-trash" data-hotspot="trash"></div>
  <div class="sprite--pj-hercules pj p-hercules" data-hotspot="hercules"></div>


  <!-- L’esprit mentor de Trash. Enveloppe + sprite : le trajet est
       sur l’une, les trois images sur l’autre. -->
  <div class="raton"><div class="sprite--raton"></div></div>
  <div class="avant avant--montant"></div>
  <div class="zone zone--salle" data-hotspot="salle"></div>

  <!-- ⚠️ LA CAMÉRA PASSE APRÈS `zone--salle`, ET C'EST TOUT LE
       CHANTIER 83. `zone--salle` est un survol transparent qui prend
       TOUTE la largeur sur y:6-20 ; la caméra vit en x:234-246, y:12-20,
       c'est-à-dire entièrement dedans. Comme la zone passait après elle,
       elle lui volait ses 100 % de surface : mesuré 0/64 points
       atteignables, donc une cible que le joueur ne pouvait pas toucher —
       alors qu'elle porte la ligne de Rabbit sur l'écrasement à 72 h, que
       le calque RA reprend en toutes lettres.
       Quand deux cibles se recouvrent, c'est la dernière du DOM qui
       gagne : la PARTICULIÈRE doit donc passer après la GÉNÉRALE. -->
  <div class="camera" data-hotspot="camera"></div>

  <!-- Astral : pourquoi il refuse -->
  <div class="calque calque--astral">
    <div class="aura aura--gardien" data-hotspot="aura-gardien"></div>
    <div class="aura aura--sas"></div>
  </div>

  <!-- RA : le registre, et l'ordre qu'on pourrait réécrire -->
  <div class="calque calque--ra">
    <div class="ora ora--registre" data-hotspot="ordre">ORDRE DE MOUVEMENT<br>08:00 — HORODATAGE NON SIGNÉ</div>
    <div class="ora ora--cam">CAM-02 · LOCAL · ÉCRASEMENT 72 H</div>
    <div class="ora ora--porte">ACCÈS DÉTENTION · COMMANDE AU POSTE</div>
    <div class="ora ora--pub">TRIBUNAL DOWNTOWN · NAVETTES 06:00 · 08:00 · 10:00</div>
  </div>

  <!-- Tactique : il est seul, et la relève arrive -->
  <div class="calque calque--tactique">
    <div class="grille-tac"></div>
    <div class="jeton j-gardien"></div>
    <div class="issue issue--sas"></div>
    <div class="cote cote--sas">SAS — VERROU DOUBLE</div>
    <div class="menace menace--cam" data-hotspot="angle-mort"></div>
    <div class="cote cote--seul">UN SEUL DÉFENSEUR</div>
  </div>
</div>
