<!--
  Tableau 5 quater — LE SOUS-SOL DE DUKE. Chantier 37 (`PLAN_PLANQUES.md`
  § 3.4), étape D du § 8 — après Herwick (36) et Sarah (37, 1/2).

  PASSE D'ART FAITE (chantier 23, lot des cinq planques). Duke a son
  sprite depuis le lot 7 ; LES TROIS GANGERS l'ont depuis celui-ci. Le
  râtelier porte DIX fusils pour neuf personnes dans la pièce, et les
  quatre moniteurs montrent quatre fois le même escalier.

  PAS DE FENÊTRE (§3.4 du plan, à la lettre) : aucune cible de ce
  tableau n'est une ouverture sur l'extérieur — le seul chemin, c'est
  l'escalier, et c'est par là que l'attaque de 8 h 40 entre, pas par un
  carreau qui vole en éclats.

  ORDRE DU DOM = ORDRE DE PILE (pas de `z-index` posé ici) : l'équipe et
  Lester en premier, tout le mobilier cliquable après.

  Grille 256 x 144 (chantier 8), même convention que les autres tableaux.
-->
<div class="tableau tableau--duke">

  <div class="fond"></div>
  <div class="plinthe"></div>
  <div class="sol"></div>
  <div class="lueur-ecrans"></div>

  <div class="caisse-munitions" data-hotspot="coffre"></div>
  <div class="ombre ombre--drakk"></div>
  <div class="ombre ombre--trash"></div>
  <div class="ombre ombre--rabbit"></div>
  <div class="ombre ombre--hercules"></div>
  <div class="ombre ombre--g1"></div>
  <div class="ombre ombre--g2"></div>
  <div class="ombre ombre--g3"></div>
  <div class="sprite--pj-drakk pj p-drakk" data-hotspot="drakk"></div>
  <div class="sprite--pj-white-rabbit pj p-rabbit" data-hotspot="rabbit"></div>
  <div class="sprite--pj-trash pj p-trash" data-hotspot="trash"></div>
  <div class="sprite--pj-hercules pj p-hercules" data-hotspot="hercules"></div>

  <!-- LESTER, contre le mur du fond. -->
  <div class="sprite--lester p-lester" data-hotspot="lester"></div>

  <!-- Les huit personnes de Duke : décor, pas des cibles individuelles —
       une seule d'entre elles compte mécaniquement (`ganger-touche`), et
       le texte la désigne sans qu'un sprite à part soit nécessaire. -->
  <div class="ganger ganger--1 sprite--prop-anonyme"></div>
  <div class="ganger ganger--2 sprite--prop-anonyme"></div>
  <div class="ganger ganger--3 sprite--prop-anonyme"></div>
  <div class="matelas"></div>

  <div class="rateliers sprite--prop-ratelier" data-hotspot="armurerie"></div>
  <div class="moniteurs-mur sprite--prop-moniteurs" data-hotspot="moniteurs"></div>

  <!-- L'escalier, seul chemin d'entrée et de l'attaque. -->
  <div class="escalier-marches" data-hotspot="escalier"></div>


  <!-- Duke — dette d'art assumée : une forme, pas un sprite. -->
  <div class="duke sprite--prop-duke" data-hotspot="duke"></div>
  <div class="fauteuil-duke"></div>

  <!-- La sortie, au premier plan. -->
  <div class="porte-blindee" data-hotspot="porte"></div>


  <!-- ── Ce que Trash voit, et lui seul ────────────────────────────
       HUIT AURAS ARMÉES, ET LE DÉCOR N'EN MONTRE QUE QUATRE. C'est le
       seul endroit du jeu où la lentille ajoute des GENS : le tableau
       dessine trois gangers et Duke, sa propre prose en compte huit
       (« les huit personnes de Duke »), et la vue de Trash aussi
       (« huit auras armées »). Les quatre autres sont dans le noir de
       la pièce, et l'astral est exactement ce qui permet de les
       compter — une lentille ajoute, et voilà ce qu'elle ajoute.

       ELLES SONT TOUTES IDENTIQUES, à la position près. « Ce n'est pas
       de la colère, c'est de la ROUTINE » : huit rythmes différents
       auraient dessiné huit humeurs, alors que le propos est qu'elles
       n'en ont plus qu'une. Seul Lester en a une à lui — c'est le seul
       de la pièce à qui il arrive quelque chose. -->
  <div class="calque calque--astral">
    <div class="aura aura--armee aa1"></div>
    <div class="aura aura--armee aa2"></div>
    <div class="aura aura--armee aa3"></div>
    <div class="aura aura--armee aa4"></div>
    <div class="aura aura--armee aa5"></div>
    <div class="aura aura--armee aa6"></div>
    <div class="aura aura--armee aa7"></div>
    <div class="aura aura--armee aa8"></div>
    <div class="aura aura--lester"></div>
  </div>

  <!-- ── Ce que Drakk voit, et lui seul ───────────────────────────
       Une pièce sans fenêtre, un escalier, et rien d'autre. La carte le
       dit deux fois sur le même objet, et c'est le propos : l'escalier
       est la seule issue ET le seul axe d'attaque. Un sous-sol qu'on ne
       peut pas quitter par ailleurs est un sous-sol qu'on ne peut pas
       défendre ailleurs.

       QUATRE JETONS, PAS HUIT — la lentille de Drakk marque ce qu'elle
       VOIT, celle de Trash compte ce qu'il y a. Les deux ne disent pas
       la même chose du même sous-sol, et c'est tout l'intérêt d'en
       avoir deux. -->
  <div class="calque calque--tactique">
    <div class="grille-tac"></div>
    <div class="menace menace--escalier"></div>
    <div class="issue issue--escalier"></div>
    <div class="cote cote--escalier">ISSUE UNIQUE = AXE D’ATTAQUE</div>
    <div class="cote cote--sansissue">AUCUNE FENÊTRE</div>
    <div class="couvert couvert--caisse"></div>
    <div class="couvert couvert--fauteuil"></div>
    <div class="cote cote--couvert">COUVERT</div>
    <div class="jeton jg jg1"></div>
    <div class="jeton jg jg2"></div>
    <div class="jeton jg jg3"></div>
    <div class="jeton j-duke"></div>
    <div class="jeton j-lester"></div>
  </div>

  <!-- ── Ce que White_Rabbit voit, et lui seul ────────────────────
       « QUATRE caméras, TOUTES tournées vers l'escalier. » Les deux
       chiffres sont dessinés : quatre fiches, et quatre visées qui
       convergent sur le même rectangle. C'est la démonstration de sa
       propre phrase — « Duke ne surveille qu'une seule porte » — et le
       joueur n'a pas besoin de la lire pour la voir.

       Le mur de moniteurs montre déjà « quatre fois le même escalier »
       dans le décor ; la RA dit d'où viennent les quatre images. -->
  <div class="calque calque--ra">
    <div class="visee vi1"></div>
    <div class="visee vi2"></div>
    <div class="visee vi3"></div>
    <div class="visee vi4"></div>
    <div class="ora ora--cam oc1">CAM-01 · ESCALIER</div>
    <div class="ora ora--cam oc2">CAM-02 · ESCALIER</div>
    <div class="ora ora--cam oc3">CAM-03 · ESCALIER</div>
    <div class="ora ora--cam oc4">CAM-04 · ESCALIER</div>
  </div>

</div>
