<!--
  Tableau 5 sexies — LE TRIPOT D'HERCULES. Chantier 41 (`PLAN_PLANQUES.md`
  § 3.5), étape D du § 8 — après Herwick (36), Sarah (37, 1/2), Duke
  (37, 2/2) et Trash (40). Les cinq décors annoncés par le chantier 35
  existent maintenant tous.

  PASSE D'ART FAITE (chantier 23, lot des cinq planques). Le Patron a
  son sprite depuis le lot 7 ; LE VIDEUR ET LES CINQ JOUEURS l'ont
  depuis celui-ci, et ils portent tous la même carte — « rien ne
  distingue personne. C'est probablement voulu. » Le râtelier de jetons
  est neuf, et il n'y a RIEN au milieu d'aucun jeton.

  PAS DE FENÊTRE, COMME CHEZ DUKE : aucune cible de ce tableau n'est une
  ouverture sur l'extérieur. La seule porte est aussi le seul chemin de
  l'attaque de 8 h 40 — pas un carreau qui vole en éclats.

  LA TABLE DE JEU EST LA CIBLE MÉCANIQUE (`table`, § en-tête de
  `hercules.js`) : les cinq joueurs autour d'elle sont du décor, pas des
  cibles individuelles — un seul d'entre eux compte, et le texte le
  désigne sans sprite à part, même geste que les gangers de Duke.

  ORDRE DU DOM = ORDRE DE PILE (pas de `z-index` posé ici) : l'équipe et
  Lester en premier, le mobilier cliquable après.

  Grille 256 x 144 (chantier 8), même convention que les autres tableaux.
-->
<div class="tableau tableau--tripot">

  <div class="fond"></div>
  <div class="plinthe"></div>
  <div class="sol"></div>
  <div class="lampe-basse"></div>

  <div class="table-jeu sprite--prop-table-jeu" data-hotspot="table"></div>
  <div class="ombre ombre--drakk"></div>
  <div class="ombre ombre--trash"></div>
  <div class="ombre ombre--rabbit"></div>
  <div class="ombre ombre--hercules"></div>
  <div class="ombre ombre--videur"></div>
  <!-- Lester n'en avait pas. Tant que les cinq autres étaient posées
       douze unités au-dessus des pieds, personne ne posait vraiment et
       son absence ne se voyait pas ; une fois les quatre runners au sol,
       il devenait le seul à flotter. -->
  <div class="ombre ombre--lester"></div>
  <div class="sprite--pj-drakk pj p-drakk" data-hotspot="drakk"></div>
  <div class="sprite--pj-white-rabbit pj p-rabbit" data-hotspot="rabbit"></div>
  <div class="sprite--pj-trash pj p-trash" data-hotspot="trash"></div>
  <div class="sprite--pj-hercules pj p-hercules" data-hotspot="hercules"></div>

  <!-- LESTER, à l'écart de la table. -->
  <div class="sprite--lester p-lester" data-hotspot="lester"></div>

  <div class="rateliers-jetons sprite--prop-jetons" data-hotspot="jetons"></div>

  <!-- La table de jeu et ses cinq joueurs — décor sauf la table
       elle-même, seule cible mécanique de ce tableau. -->
  <div class="joueur joueur--1 sprite--prop-anonyme-assis"></div>
  <div class="joueur joueur--2 sprite--prop-anonyme-assis"></div>
  <div class="joueur joueur--3 sprite--prop-anonyme-assis"></div>
  <div class="joueur joueur--4 sprite--prop-anonyme-assis"></div>
  <div class="joueur joueur--5 sprite--prop-anonyme-assis"></div>

  <div class="guichet-change sprite--prop-guichet-change" data-hotspot="guichet"></div>

  <!-- Le Patron — dette d'art assumée : une forme, pas un sprite. -->
  <div class="patron sprite--prop-patron" data-hotspot="patron"></div>
  <div class="caisse-patron"></div>

  <div class="videur-forme sprite--prop-anonyme" data-hotspot="videur"></div>

  <!-- La sortie, au premier plan. -->
  <div class="porte-sans-enseigne" data-hotspot="porte"></div>


  <!-- ── Ce que Trash voit, et lui seul ────────────────────────────
       CINQ, PLUS UNE. Sa vue donne l'arithmétique exacte — « cinq auras
       penchées sur des cartes, et une SIXIÈME, plus froide, qui ne joue
       pas pour l'argent posé sur le tapis » — et c'est la seule chose
       que ce calque dessine. Ni le Patron, ni le videur, ni Lester : le
       compte EST le contenu, et une septième aura aurait cassé la seule
       information que Trash apporte à ce tableau.

       LA SIXIÈME N'EST POSÉE SUR PERSONNE, et c'est délibéré. Le
       tableau tient sur « rien ne le distingue » (§3.5 du plan) : c'est
       `table.regarder`, tenu par Hercules, qui pose `tueur-repere`.
       Une aura froide centrée sur un joueur précis aurait donné le
       nom à la place du personnage. Elle flotte donc au-dessus du
       tapis, à cheval sur trois places — assez pour qu'on la voie,
       jamais assez pour qu'on sache laquelle. -->
  <div class="calque calque--astral">
    <div class="aura aura--joueur aj1"></div>
    <div class="aura aura--joueur aj2"></div>
    <div class="aura aura--joueur aj3"></div>
    <div class="aura aura--joueur aj4"></div>
    <div class="aura aura--joueur aj5"></div>
    <div class="aura aura--froide"></div>
  </div>

  <!-- ── Ce que Drakk voit, et lui seul ───────────────────────────
       Pas de fenêtre, une porte, une table au milieu. Les cinq jetons
       de la table sont IDENTIQUES, pour la même raison que les trois
       gardes du parvis le sont : le décor refuse de désigner qui que ce
       soit, et une lentille qui le ferait à sa place viderait le beat
       d'Hercules de son sens. -->
  <div class="calque calque--tactique">
    <div class="grille-tac"></div>
    <div class="issue issue--porte"></div>
    <div class="cote cote--porte">SEULE ISSUE</div>
    <div class="cote cote--sansfenetre">AUCUNE FENÊTRE</div>
    <div class="couvert couvert--table"></div>
    <div class="couvert couvert--caisse"></div>
    <div class="cote cote--couvert">COUVERT</div>
    <div class="jeton jj jj1"></div>
    <div class="jeton jj jj2"></div>
    <div class="jeton jj jj3"></div>
    <div class="jeton jj jj4"></div>
    <div class="jeton jj jj5"></div>
    <div class="jeton j-patron"></div>
    <div class="jeton j-videur"></div>
    <div class="jeton j-lester"></div>
  </div>

  <!-- ── Ce que White_Rabbit voit, et lui seul ────────────────────
       LE CALQUE RA LE PLUS VIDE DU JEU, ET IL EST VIDE EXPRÈS. « Aucun
       signal. Pas une caméra, pas un lecteur, pas un tag — le genre
       d'endroit qui existe exprès pour ne rien laisser à lire. »

       Il reste UN cadre, et ce n'est pas une ORA : c'est le résultat du
       balayage, dessiné creux — trait pointillé, fond nul, aucun
       flottement — pour qu'on ne le confonde jamais avec quelque chose
       qui émet. Sans lui, la lentille de Rabbit aurait eu l'air d'un
       oubli au lieu d'une réponse ; avec lui, « la sécurité la plus
       efficace que j'aie jamais vue : ne rien connecter du tout »
       devient une chose qu'on regarde. -->
  <div class="calque calque--ra">
    <div class="ora ora--nul">BALAYAGE — AUCUN SIGNAL</div>
  </div>

</div>
