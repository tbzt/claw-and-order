<!--
  Tableau 8 — LE LOCAL DE RÉPÉTITION. Les amis de Teresa Banks.
  Chantier 28 (`PLAN_TRAME_ACTES_III_IV.md` § 7.3, rang 5 du § 10) — le
  premier tableau de l'ACTE IV, et le premier du jeu qui ne se joue pas
  la nuit du contrat.

  PASSE D'ART FAITE (chantier 23, 2ᵉ décor) : les quatre habitants ont
  leur sprite depuis le lot 7, et le décor a le sien depuis ce lot — le
  mur d'affiches et ses trente photos dont onze d'elle, les six bacs,
  le pied de micro avec son câble, la batterie et son pied de caisse
  claire VIDE, l'ampli, la carte de visite à deux lignes.

  ET LE SOL EN EST UN, MAINTENANT : trois bandes au lieu de deux (mur,
  plinthe, plancher), et des lignes de pieds vraies. Avant ce lot,
  personne dans ce tableau ne touchait le sol — les pieds de Nita
  s'arrêtaient dix-huit unités au-dessus de la ligne.

  PAS DE LESTER DANS CE DÉCOR, et c'est le fait de mise en scène du
  tableau : il est à McNeil, et l'équipe travaille pour lui sans l'avoir
  sur les bras. Les cinq décors de planque avaient tous une silhouette
  assise à l'écart ; celui-ci n'en a pas, et le vide se voit.

  UNE SEULE OUVERTURE, le rideau de fer, au premier plan à droite —
  comme chez Duke et au tripot, aucune cible n'est une fenêtre.

  LA CARTE DE VISITE EST UNE CIBLE À PART DU COMPTOIR : le comptoir est
  du décor (aucun `data-hotspot`), la carte en est une. Ce ne sont pas
  deux cibles pour une même chose — c'est un meuble et un objet posé
  dessus (convention « une chose du monde, une seule cible »).

  ORDRE DU DOM = ORDRE DE PILE (pas de `z-index` posé ici) : l'équipe
  d'abord, les quatre amis et le mobilier ensuite — le mobilier du
  premier plan repasse donc devant les jambes, exactement comme la table
  du tripot (chantier 14).

  Grille 256 x 144 (chantier 8), même convention que les autres tableaux.
-->
<div class="tableau tableau--amis">

  <div class="fond"></div>
  <div class="plinthe"></div>
  <div class="sol"></div>

  <div class="ombre ombre--drakk"></div>
  <div class="ombre ombre--trash"></div>
  <div class="ombre ombre--rabbit"></div>
  <div class="ombre ombre--hercules"></div>

  <div class="sprite--pj-drakk pj p-drakk" data-hotspot="drakk"></div>
  <div class="sprite--pj-trash pj p-trash" data-hotspot="trash"></div>
  <div class="sprite--pj-white-rabbit pj p-rabbit" data-hotspot="rabbit"></div>
  <div class="sprite--pj-hercules pj p-hercules" data-hotspot="hercules"></div>

  <!-- Le mur d'affiches : quinze ans de couches, et par-dessus trente
       photos punaisées à plat dont ONZE portent son visage. -->
  <div class="mur-affiches sprite--prop-affiches" data-hotspot="mur"></div>

  <!-- NITA, debout près du mur, sa pile de tracts sous le bras. -->
  <div class="ombre ombre--nita"></div>
  <div class="ami ami--nita sprite--prop-nita" data-hotspot="nita"></div>

  <!-- Les bacs à vinyles — ce qui reste du magasin. SIX, comptables,
       avec leurs intercalaires écrits à la main. -->
  <div class="bacs-vinyles sprite--prop-bacs" data-hotspot="bacs"></div>

  <!-- Décor : la batterie — et son pied de caisse claire resté vide —
       puis l'ampli posé au sol. -->
  <div class="batterie sprite--prop-batterie"></div>
  <div class="ampli ampli--sol sprite--prop-ampli"></div>

  <!-- Le micro d'elle, encore sur son pied, encore branché. -->
  <div class="pied-micro sprite--prop-micro" data-hotspot="micro"></div>

  <!-- MARK, assis sur le second ampli, la pochette vide entre les mains. -->
  <div class="ampli ampli--mark sprite--prop-ampli"></div>
  <div class="ami ami--mark sprite--prop-mark" data-hotspot="mark"></div>

  <!-- Le comptoir de l'ancien magasin — décor — et ce qu'on y a laissé :
       un nom qui n'est pas un nom, un code de comm, et rien d'autre. -->
  <div class="comptoir"></div>
  <div class="carte-tir sprite--prop-carte-tir" data-hotspot="carte"></div>

  <!-- NOVA, adossée au montant du rideau, entre vous et la rue. -->
  <div class="ombre ombre--nova"></div>
  <div class="ami ami--nova sprite--prop-nova" data-hotspot="nova"></div>

  <!-- PSYCH, allongé entre les amplis, au premier plan. -->
  <div class="ami ami--psych sprite--prop-psych" data-hotspot="psych"></div>

  <!-- La sortie : le rideau de fer bloqué à mi-hauteur. -->
  <div class="grille-fer" data-hotspot="grille"></div>


  <!-- ── Ce que Trash voit, et lui seul ────────────────────────────
       « La pièce est saturée. PAS DE LA FILLE — de ce que quatre
       personnes ont laissé dedans à force d'y revenir. » Les deux
       moitiés de la phrase sont dessinées, et la seconde est la plus
       dure : la nappe de veillée couvre tout le local SAUF le mur
       d'affiches, là où sont ses onze photos. Un trou dans la
       saturation, à l'endroit exact où le joueur s'attend à trouver
       quelque chose d'elle. Il n'y a rien. C'est le tableau.

       Le trou est un manque DANS CE QUI EST AJOUTÉ, pas un retrait du
       monde : la lentille pose un voile, et le voile s'arrête là. Rien
       du décor n'est effacé (règle : une lentille ajoute). -->
  <div class="calque calque--astral">
    <div class="veillee"></div>
    <div class="aura aura--nita"></div>
    <div class="aura aura--mark"></div>
    <div class="aura aura--nova"></div>
    <div class="aura aura--psych"></div>
  </div>

  <!-- ── Ce que Drakk voit, et lui seul ───────────────────────────
       « Un donjon à une porte. Ce n'est pas dangereux tant que personne
       ne sait qu'on y est. » Donc : une issue, deux masses derrière
       lesquelles se mettre, et AUCUN JETON HOSTILE — les quatre
       marqueurs de la pièce sont neutres. Drakk compte des gens, il ne
       les accuse pas. -->
  <div class="calque calque--tactique">
    <div class="grille-tac"></div>
    <div class="issue issue--grille"></div>
    <div class="cote cote--grille">SEULE ISSUE — RIDEAU</div>
    <div class="couvert couvert--comptoir"></div>
    <div class="couvert couvert--bacs"></div>
    <div class="cote cote--couvert">COUVERT</div>
    <div class="cote cote--donjon">AUCUNE SECONDE ISSUE</div>
    <div class="jeton j-nita"></div>
    <div class="jeton j-mark"></div>
    <div class="jeton j-nova"></div>
    <div class="jeton j-psych"></div>
  </div>

  <!-- ── Ce que White_Rabbit voit, et lui seul ────────────────────
       UNE SEULE FICHE DANS TOUT LE TABLEAU, et c'est la lentille RA la
       plus vide du jeu. Sa vue le dit mot pour mot : « Aucun tag
       commercial, aucune balise. UN SEUL OBJET ÉMET dans cette pièce. »
       La règle 7 (la RA est bruyante, et ce bruit EST du contenu) vaut
       pour un bar de Redmond ou un parvis de Downtown ; ici, c'est
       l'inverse qui porte le sens, et en ajouter une deuxième aurait
       coûté au tableau son unique effet.

       Le fil descend jusqu'à la carte pour que le joueur sache OÙ
       regarder : une fiche seule au milieu du vide ne désigne rien. -->
  <div class="calque calque--ra">
    <div class="ora ora--carte">CODE DE COMM · USAGE UNIQUE · ACTIF</div>
    <div class="fil-carte"></div>
  </div>

</div>
