<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claw &amp; Order</title>
  <link rel="stylesheet" href="css/engine.css">
  <link rel="stylesheet" href="css/sprites.css">
  <link rel="stylesheet" href="css/scene-bar.css">
  <link rel="stylesheet" href="css/scene-quai.css">
  <link rel="stylesheet" href="css/scene-quai-voilier.css">
  <link rel="stylesheet" href="css/scene-greffe.css">
  <link rel="stylesheet" href="css/scene-greffe-cellule.css">
  <link rel="stylesheet" href="css/scene-retour.css">
  <link rel="stylesheet" href="css/scene-planque.css">
  <link rel="stylesheet" href="css/scene-herwick.css">
  <link rel="stylesheet" href="css/scene-sarah.css">
  <link rel="stylesheet" href="css/scene-duke.css">
  <link rel="stylesheet" href="css/scene-squat.css">
  <link rel="stylesheet" href="css/scene-tripot.css">
  <link rel="stylesheet" href="css/scene-amis.css">
  <link rel="stylesheet" href="css/scene-appartement.css">
  <link rel="stylesheet" href="css/scene-shameless.css">
  <link rel="stylesheet" href="css/scene-waters.css">
  <link rel="stylesheet" href="css/scene-matrice-waters.css">
  <link rel="stylesheet" href="css/scene-tribunal.css">
  <link rel="stylesheet" href="css/scene-tribunal-salle.css">
  <link rel="stylesheet" href="css/scene-carte.css">
</head>
<body>

  <!-- Pixelisation. Recette classique : on sème un point tous les N px,
       on n'échantillonne la source qu'à ces points, puis on dilate
       chaque point en un bloc de N px. -->
  <svg class="filtres" aria-hidden="true" focusable="false">
    <filter id="pixel-3" x="0" y="0" width="100%" height="100%">
      <feFlood x="1" y="1" width="1" height="1" flood-color="#000"/>
      <feComposite width="3" height="3"/>
      <feTile result="grille"/>
      <feComposite in="SourceGraphic" in2="grille" operator="in"/>
      <feMorphology operator="dilate" radius="1.5"/>
    </filter>
    <filter id="pixel-4" x="0" y="0" width="100%" height="100%">
      <feFlood x="2" y="2" width="1" height="1" flood-color="#000"/>
      <feComposite width="4" height="4"/>
      <feTile result="grille"/>
      <feComposite in="SourceGraphic" in2="grille" operator="in"/>
      <feMorphology operator="dilate" radius="2"/>
    </filter>
    <filter id="pixel-6" x="0" y="0" width="100%" height="100%">
      <feFlood x="3" y="3" width="1" height="1" flood-color="#000"/>
      <feComposite width="6" height="6"/>
      <feTile result="grille"/>
      <feComposite in="SourceGraphic" in2="grille" operator="in"/>
      <feMorphology operator="dilate" radius="3"/>
    </filter>
  </svg>

  <div class="jeu">

    <div class="stage" id="stage" data-astral="off">
      <div class="decor" id="decor"><!-- scène injectée --></div>

      <!-- Dans un point & click, on voit qui parle. Trois portraits
           48x48 étaient dessinés depuis le début du projet, générés dans
           sprites.css, et affichés nulle part. Ils le sont maintenant —
           pour les PNJ. Les runners, eux, sont déjà désignés dans le
           décor par leur liseré de couleur : deux signaux pour la même
           information, ce serait un de trop. -->
      <div class="portrait" id="portrait" hidden>
        <div class="portrait__image" id="portraitImage"></div>
        <p class="portrait__nom" id="portraitNom"></p>
      </div>

      <p class="bulle bulle--pnj" id="bullePnj" hidden></p>
      <p class="bulle bulle--recit" id="bulleRecit" hidden></p>

      <div class="etiquette" id="etiquette" hidden></div>
      <div class="curseur" id="curseur" hidden></div>

      <div class="choix" id="choix" hidden></div>

      <!-- Le carnet de recoupement. On y pose deux fiches l'une sur
           l'autre ; si la paire est prévue, elle en produit une
           troisième. Règle 12 : ça ouvre la parole, jamais une porte. -->
      <!-- Le journal. Tout ce qui a été dit, dans l'ordre, relisible.
           Une réplique qu'on n'a pas eu le temps de lire n'est plus
           perdue — et dans un jeu où lire EST le jeu, c'était la gêne
           la plus visible du prototype. -->
      <div class="journal" id="journal" hidden>
        <p class="journal__titre">Ce qui a été dit</p>
        <div class="journal__liste" id="journalListe"></div>
      </div>

      <!-- Les états gardés (chantier 15). L'automatique (F5) est unique
           et s'écrase à chaque repos ; ici, une liste d'instantanés
           gardés sur demande, chacun étiqueté par son lieu et son
           heure — jamais un nom tapé au clavier. -->
      <div class="journal gardees" id="gardees" hidden>
        <p class="journal__titre">Les états gardés</p>
        <button class="gardees__garder" id="boutonGarder">Garder cet instant</button>
        <div class="journal__liste" id="gardeesListe"></div>
      </div>

      <!-- L'étal + la table (chantier 21). L'étal montre toutes les
           fiches en jetons courts, reconnaissables avant d'être lus ;
           la table lit le texte long — la fiche tenue et celle qu'on
           survole, toujours visibles ensemble. -->
      <div class="carnet" id="carnet" hidden>
        <p class="carnet__titre">Carnet de recoupement
          <!-- Combien de recoupements existent, et combien sont faits.
               C'est la seule chose qui dise au joueur qu'il en reste. -->
          <span class="carnet__progres" id="carnetProgres"></span>
        </p>
        <div class="carnet__corps">
          <div class="carnet__etal" id="carnetGrille"></div>
          <div class="carnet__table">
            <div class="carnet__fiche carnet__fiche--tenue" id="carnetTenue"></div>
            <p class="carnet__aide" id="carnetAide">Prends un jeton, pose-le sur un autre.</p>
            <div class="carnet__fiche carnet__fiche--survolee" id="carnetSurvolee"></div>
          </div>
        </div>
        <!-- La barre (chantier 20). N'existe QUE dans le tableau qui
             expose `scene.barre` — ailleurs, ce panneau reste caché,
             comme il l'a toujours été. -->
        <div class="carnet__depose" id="carnetDepose" hidden>
          <button class="depose-barre" id="boutonDepose">Déposer à la barre</button>
        </div>
      </div>

      <!-- Le réseau. Le geste du carnet, transposé : on pose une fiche
           sur un contact au lieu d'une fiche sur une autre. Un contact
           appartient à un runner : le sous-titre du bouton le nomme, et
           c'est lui qui parlera. Le joueur n'a pas à basculer avant —
           les quatre sont dans la même pièce. -->
      <div class="reseau" id="reseau" hidden>
        <p class="reseau__titre">Le réseau</p>
        <div class="carnet__grille" id="reseauGrille"></div>
        <div class="reseau__contacts" id="reseauContacts"></div>
        <p class="carnet__aide" id="reseauAide">Pose une fiche sur un contact.</p>
      </div>

      <!-- La sacoche (chantier 67). L'inventaire était le bloc DÉSIGNÉ
           PERDANT du HUD : seul `flex: 1 1 0` au milieu de `flex: 0 0
           auto`, il cédait sa largeur à tous les autres et défilait. À
           douze objets il en réclamait 570 et n'en obtenait jamais
           autant. Il devient le sixième panneau, sur le patron du
           carnet — l'étal montre ce qu'on porte, la table dit ce que
           c'est et d'où ça vient. Prendre un objet REFERME le panneau :
           la cible qu'on vise est derrière. -->
      <div class="carnet sacoche" id="sacoche" hidden>
        <p class="carnet__titre">Sacoche
          <span class="carnet__progres" id="sacocheProgres"></span>
        </p>
        <div class="carnet__corps">
          <div class="carnet__etal" id="sacocheEtal"></div>
          <div class="carnet__table">
            <div class="carnet__fiche carnet__fiche--tenue" id="sacocheDetail"></div>
            <p class="carnet__aide" id="sacocheAide">Survole un objet pour le regarder.</p>
          </div>
        </div>
      </div>

      <!-- LES FICHES D'ÉQUIPE (chantier 70). Quatre cartes de front, et
           pas d'étal : il n'y a que quatre fiches, pour toujours.
           Sélectionner pour lire coûterait un geste qui n'achète rien,
           et surtout la comparaison EST le propos — « qu'est-ce que
           j'aurais vu si j'avais été quelqu'un d'autre ? »
           (DOCTRINE — LES QUATRE REGARDS, § 15). Les quatre côte à côte
           font de cette question la lecture par défaut.

           Aucun bouton n'active rien : le § 9 interdit l'arbre de
           compétences. On lit qui ils sont ; on change de runner au HUD
           comme avant.

           PAS DE BOUTON NEUF AU HUD non plus — il ne reste que 12 px de
           marge à 1024 de large (voir l'en-tête de `.hud`), et un
           septième bouton le ferait passer à deux rangs. Le panneau
           s'ouvre à la touche E, ou en recliquant le runner DÉJÀ actif :
           ce clic-là ne faisait rien du tout jusqu'ici. -->
      <div class="carnet equipe-fiches" id="equipeFiches" hidden>
        <!-- Pas de sous-titre. Il y en avait un — « Quatre façons d'être
             attentif, pas quatre clés » — et c'était le § 15 de la
             doctrine récité au joueur. Un panneau n'a pas à expliquer sa
             propre intention (Boussole § 2) : les quatre fiches côte à
             côte le font, ou elles ne le font pas. -->
        <p class="carnet__titre">L’équipe</p>
        <div class="equipe-fiches__rangee" id="equipeRangee"></div>
      </div>

      <div class="rideau" id="rideau" hidden>
        <p class="rideau__titre">FIN DU PROTOTYPE</p>
        <p class="rideau__ligne" id="rideauLigne"></p>
        <p class="rideau__bilan" id="rideauBilan"></p>
        <button class="rideau__reprise" id="reprise">Rejouer</button>
      </div>

      <!-- Une automatique lisible se PROPOSE au démarrage, elle ne se
           charge pas d'office : rouvrir l'onglet pour recommencer ne
           doit pas rejeter le joueur au milieu de la nuit d'hier. -->
      <div class="reprise-auto" id="repriseAuto" hidden>
        <p class="reprise-auto__titre">UNE NUIT EST EN COURS</p>
        <p class="reprise-auto__lieu" id="repriseAutoLieu"></p>
        <div class="reprise-auto__boutons">
          <button class="reprise-auto__bouton" id="repriseAutoContinuer">Reprendre</button>
          <button class="reprise-auto__bouton reprise-auto__bouton--fantome" id="repriseAutoNouveau">Nouvelle nuit</button>
        </div>
      </div>
    </div>

    <div class="hud">
      <!-- Les trois verbes ont quitté le HUD : le clic gauche joue le verbe
           principal de la cible, le clic droit regarde. Le forçage survit au
           clavier (1, 2, 3 hors dialogue) pour les rares gestes que le
           contextuel ne montre plus. Voir `verbePrincipal()`, js/interact.js. -->

      <button class="bouton-allure" id="boutonAllure" title="Cadence du texte (A)">
        <span class="bouton-allure__jauge" id="allureJauge"></span>
        <span id="allureNom">NORMAL</span>
      </button>

      <span class="hud-heure" id="hudHeure" title="L’heure, cette nuit">23:00</span>

      <button class="bouton-carnet" id="boutonJournal" aria-pressed="false">Journal</button>

      <button class="bouton-carnet" id="boutonCarnet" aria-pressed="false">
        Carnet
        <span class="bouton-carnet__compte" id="carnetCompte" title="Fiches au carnet">0</span>
        <span class="bouton-carnet__compte est-deduction" id="carnetRecoupements"
              title="Recoupements trouvés">0/0</span>
        <!-- Combien de fiches acquises et pas encore lues. Le bouton
             pulsait déjà, mais sans dire combien ni lesquelles. -->
        <span class="bouton-carnet__neuves" id="carnetNeuves"
              title="Fiches pas encore lues" hidden>+0</span>
      </button>

      <button class="bouton-carnet" id="boutonReseau" aria-pressed="false">Réseau</button>

      <button class="bouton-carnet" id="boutonGardees" aria-pressed="false" title="États gardés (G)">États gardés</button>

      <!-- LA MAIN. Tout ce qui reste de l'inventaire au HUD, et le seul
           bouton de la sacoche : un emplacement qui montre ce qu'on
           tient, un compteur qui dit ce qui reste dedans, et un clic qui
           ouvre le panneau. Un bouton NOMMÉ à côté d'elle a été essayé —
           il coûtait un second rang au HUD (105 px contre 61, mesuré à
           1024 de large), pour un geste que la main faisait déjà. Elle
           ne grandit pas avec l'inventaire : la cause du débord d'avant
           n'existe plus. Reposer se fait à Échap, ou dans le vide. -->
      <button class="main" id="main" aria-pressed="false" title="Sacoche (S)">
        <span class="jeton__icone" id="mainIcone"></span>
        <span class="main__compte" id="sacocheCompte" title="Objets portés">0</span>
      </button>

      <div class="equipe" id="equipe" role="group" aria-label="L’équipe">
        <button class="runner est-actif" data-runner="hercules" data-vue="physique" title="Hercules — recliquer pour sa fiche (E)">Hercules</button>
        <button class="runner" data-runner="trash"    data-vue="astrale"  title="Trash — recliquer pour sa fiche (E)">Trash</button>
        <button class="runner" data-runner="rabbit"   data-vue="ra"       title="White_Rabbit — recliquer pour sa fiche (E)">White_Rabbit</button>
        <button class="runner" data-runner="drakk"    data-vue="tactique" title="Drakk — recliquer pour sa fiche (E)">Drakk</button>
      </div>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
